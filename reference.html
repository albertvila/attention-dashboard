<title>Workflow &amp; skills — reference</title>
<!--
  The reference page — my workflow and my skills on one page, served at
  /reference beside the Briefing.

  Static: it renders no snapshot, reads no parking file, and holds no producer
  state. The queue's rules do not reach it and it is not queue data — it is a
  hand-maintained page, edited here. Nothing is persisted.

  Provenance, all in the dotfiles repo under docs/:
    dev-workflow.excalidraw, diagram.excalidraw, matt-pocock-flow.excalidraw
      the six-step loop, the two run shapes, the single-thread flow
    skills-cheatsheet.html
      the skills table, lifted verbatim
  That repo also keeps the prototype this layout was chosen from, in
  .scratch/prototype-diagrams/.
-->
<style>

    --warn:#e0af68;

  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,"SF Pro Text",system-ui,sans-serif;padding-bottom:40px}
  code{font-family:ui-monospace,Menlo,monospace;color:var(--mono)}
  a{color:var(--accent);text-decoration:none}

  header.banner{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 24px 10px}
  .brow{max-width:1180px;margin:0 auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  h1{font-size:19px;font-weight:650;white-space:nowrap}
  h1 span{color:var(--dim);font-weight:400;font-size:14px}
  #q{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 13px;font-size:14px;outline:none}
  #q:focus{border-color:var(--accent)}
  .srcrow{max-width:1180px;margin:10px auto 0;display:flex;flex-wrap:wrap;gap:7px}
  .chip{display:inline-flex;align-items:center;gap:6px;cursor:pointer;background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:3px 11px;font-size:12px;color:var(--dim)}
  .chip:hover{border-color:#3a4151;color:var(--text)}
  .chip.active{border-color:currentColor;color:var(--text)}
  .chip .dot{width:8px;height:8px;border-radius:50%}
  .chip b{color:var(--text);font-weight:600}

  main{max-width:1180px;margin:0 auto;padding:10px 24px 40px}
  h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:30px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--border)}
  h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:0 0 8px}
  .muted{color:var(--dim)}
  .hidden{display:none !important}
  .dimmed{opacity:.32}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:11px 13px}
  .card:hover{border-color:#3a4151}
  .card.sel{border-color:var(--accent);background:var(--panel2)}
  .card .desc2{display:none;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:13px;color:var(--text)}
  .card.sel .desc2{display:block}
  .card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .name{font-family:ui-monospace,Menlo,monospace;font-size:13.5px;color:var(--mono);font-weight:600}
  .badge{flex-shrink:0;font-size:10px;font-weight:700;border-radius:999px;padding:2px 8px;border:1px solid}
  .desc{color:var(--dim);font-size:13px;margin-top:4px}
  .usage{font-size:12px;color:var(--dim);margin-top:6px}
  .usage b{color:var(--text)}
  .pill{display:inline-block;font-size:10.5px;font-weight:650;border-radius:999px;padding:2px 8px;background:#6cb6ff18;color:var(--accent);border:1px solid #6cb6ff33}
  button.pill{font-family:inherit;cursor:pointer;line-height:1.5}
  button.pill:hover{border-color:var(--accent)}
  .pill.warn{background:#e0af6818;color:var(--warn);border-color:#e0af6833}
  .pill.mono{font-family:ui-monospace,Menlo,monospace;background:#9ece6a14;color:var(--mono);border-color:#9ece6a33}

  ul.tight{margin:6px 0 0 18px;font-size:13px;color:var(--dim)}
  ul.tight li{margin:3px 0}
  ul.tight b{color:var(--text);font-weight:600}


  /* ---- the board ---- */

  .flowbox{border:1px solid var(--border);border-radius:12px;padding:13px 14px;background:var(--panel)}
  .flowbox h4{font-size:14px;font-weight:600}
  .flowbox .tag{margin-left:8px}
  .flow{margin-top:10px;font-size:12.5px;color:var(--dim);line-height:1.9}
  .node{display:inline-block;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;margin:0 2px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--text)}

  .node.pony{border-color:#e0af6855;color:var(--warn)}
  .sep{color:#3a4151;margin:0 3px}
  .rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}

  #skills{scroll-margin-top:132px}

  footer{max-width:1180px;margin:30px auto 0;color:var(--dim);font-size:12.5px;border-top:1px solid var(--border);padding-top:14px}
</style>
</head>

    run:'/orchestrate-bb-threads @.scratch/repo-cleanup/issues/ — PR per item',
    runNote:'say it, or you get Flow A',
    lane:[['manager','ledger: orchestration.json'],['worker 0n','/implement — own worktree + branch · Flash'],['review 0n','/code-review — fresh eyes · Sonnet 5','rev'],['ponytail 0n','/ponytail-review · Flash','pony'],['open PR 0n','you review on GitHub']],
    tails:['findings → same worker, cap 3','findings → same or new worker, NO re-review, cap 3','ponytail fix path: worker implements findings → straight back to ponytail','after your reviews: manager merges PRs in dependency order (or you do), resolving cross-PR conflicts, then retires the worktrees'] },
];

/* ---- the single-thread flow, for work that does not need a run ---- */
const REFERENCE = {
  title:'The Matt Pocock flow — idea → open PR',
  sub:'Seven small composable skills in a line, not one owned process. Align before code, review before the PR. This is the single-thread flow — the same six steps without the orchestration.',
  href:'https://github.com/mattpocock/skills',
  setup:'One-time setup per repo: /setup-matt-pocock-skills installs the rest',
  steps:[['1 · Align','/grill-with-docs — interview only, no code'],['2 · Spec','/to-spec — one spec, one file'],['3 · Tickets','/to-tickets — tracer bullets + blockedBy'],['4 · Build','/implement — one vertical slice, TDD'],['5 · Fresh eyes','/code-review — standards + spec'],['6 · Ship','open PR — you review on GitHub']],
};

/* ---- automations and standing rules ---- */
const AUTOMATIONS = [
  { name:'scratch-sweep', when:'weekly · Mon 09:00 · auto_9zgd3nv-z3i',
    body:'Scans .scratch/ across every project for pending specs, classifies each as spec-only or tickets-ready, and files one BB task per spec behind a human gate. Deduped by path.',
    skills:['bb-cli'] },
];

/* =============================================================== RENDER == */
const SKILL_INDEX = {};
for (const [section, skills] of SECTIONS)
  for (const [name, desc, src, usage] of skills)
    SKILL_INDEX[name] = { name, desc, src, usage, section };

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const state = { q:'', src:null, sel:null };

function skillCard(name) {
  const s = SKILL_INDEX[name];
  if (!s) return `<div class="card" data-name="${esc(name)}" data-src="custom"><div class="top"><div class="name">/${esc(name)}</div><span class="badge" style="color:#8b93a1;border-color:#8b93a155">not in cheatsheet</span></div></div>`;
  const c = SOURCES[s.src] || { label:s.src, color:'#8b93a1' };
  return `<div class="card" data-name="${esc(name)}" data-src="${s.src}" data-s="${(name+' '+s.desc+' '+c.label+' '+(s.usage||'')).toLowerCase()}">
    <div class="top"><div class="name">/${esc(name)}</div>
    <span class="badge" style="color:${c.color};border-color:${c.color}55;background:${c.color}14">${c.label}</span></div>
    <div class="desc">${esc(s.desc)}</div>${s.usage ? `<div class="usage"><b>Use:</b> ${esc(s.usage)}</div>` : ''}</div>`;
}
// A JS action, not a link: an <a href="#"> is focusable, and Chromium's
// post-click focus fixup runs after the handler — by which time the click target
// is gone (the handler re-rendered it), so it focuses <body> and scrolls to 0,
// silently undoing any scroll the handler asked for.
function skillPill(name) {
  return `<button type="button" class="pill mono" data-jump="${esc(name)}">/${esc(name)}</button>`;
}
// the one predicate every variant and the state readout agree on
function matches(name) {
  const s = SKILL_INDEX[name];
  if (state.src && (!s || s.src !== state.src)) return false;
  if (!state.q) return true;
  const hay = s ? (name + ' ' + s.desc + ' ' + (s.usage || '')).toLowerCase() : name.toLowerCase();
  return hay.includes(state.q);
}
const hits = names => names.filter(matches).length;

function renderSkills() {
  const html = SECTIONS.map(([title, skills]) => {
    const cards = skills.filter(([n]) => matches(n)).map(([n]) => skillCard(n)).join('');
    return cards ? `<section data-sect="${esc(title)}"><h2>${esc(title)}</h2><div class="grid">${cards}</div></section>` : '';
  }).join('');
  return { html, shown: matchedCount() };
}
const ALL_SKILLS = SECTIONS.flatMap(([, s]) => s.map(([n]) => n));
const matchedCount = () => ALL_SKILLS.filter(matches).length;

// one flow box for the two run shapes, so they cannot drift apart
function flowBox(f) {
  const chain = f.lane.map(([t, , k], i) => `${i ? '<span class="sep">→</span>' : ''}<span class="node ${k || ''}">${esc(t)}</span>`).join('');
  return `<div class="flowbox"><h4>${esc(f.title)}<span class="tag pill ${f.key === 'A' ? '' : 'warn'}">${esc(f.tag)}</span></h4>
    <p class="desc">${esc(f.note)}</p>
    <div class="flow">${chain}</div>
    <ul class="tight">${f.lane.filter(([, sub]) => sub).map(([t, sub]) => `<li><b>${esc(t)}</b> — ${esc(sub)}</li>`).join('')}</ul>
    <div class="usage" style="margin-top:8px"><code>${esc(f.run)}</code></div>
    <ul class="tight">${f.tails.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>`;
}

// the supporting-skills cards, shared by the loop board's helper set
function supportingBlock() {
  return `<div class="grid">${SUPPORTING.map(s => `<div class="card"><div class="top"><div class="name">${esc(s.cmd)}</div>${skillPill(s.skill)}</div><div class="desc">${esc(s.why)}</div></div>`).join('')}</div>`;
}

function board() {
  const ref = renderSkills();
  return `<h2>The loop</h2>
    <div class="rules">${WORKFLOW.map(s => {
      const dead = (state.q || state.src) && hits(s.skills) === 0;
      return `<div class="card ${dead ? 'dimmed' : ''} ${state.sel === s.id ? 'sel' : ''}" data-step="${s.id}" style="cursor:pointer">
        <div class="top"><span class="pill">${s.n}</span><span class="name">${esc(s.cmd)}</span></div>
        <div class="desc" style="color:var(--text)">${esc(s.title)} — ${esc(s.sub)}</div>
        <div class="usage">${s.skills.map(skillPill).join(' ')}</div>
        <div class="desc2">${esc(s.body)}<br><span class="muted">produces:</span> ${esc(s.out)}</div></div>`;
    }).join('')}</div>
    <div class="loopback">↩ ${esc(LOOPBACK.from)} → ${esc(LOOPBACK.to)} · ${esc(LOOPBACK.text)}</div>
    <div class="loopback">Your gates: ${GATES.map(esc).join(' · ')}</div>
    <h2>Pulled in when the work needs them</h2>
    ${supportingBlock()}
    <h2>Step 5 — pick a shape per run</h2>
    <div class="grid">${FLOWS.map(flowBox).join('')}</div>
    <h2>Automations</h2><div class="rules">${AUTOMATIONS.map(a => `<div class="card"><div class="top"><div class="name">${esc(a.name)}</div><span class="usage">${esc(a.when)}</span></div><div class="desc">${esc(a.body)}</div></div>`).join('')}
      <div class="card"><div class="name" style="color:var(--accent);font-size:13px">${esc(REFERENCE.title)}</div><div class="desc">${esc(REFERENCE.sub)}</div><div class="usage"><a href="${REFERENCE.href}">${REFERENCE.href}</a></div></div></div>    <h2 id="skills">Skills — ${ref.shown} shown</h2>${ref.html}`;
}

/* ---- shell ---- */
const app = document.getElementById('app');
function render() {
  state.q = document.getElementById('q').value.trim().toLowerCase();
  app.innerHTML = board();
  applySkillFilter();
}
function applySkillFilter() {
  for (const card of document.querySelectorAll('main .card[data-name]')) {
    const name = card.dataset.name, s = SKILL_INDEX[name];
    const hay = card.dataset.s || name.toLowerCase();
    const ok = (!state.q || hay.includes(state.q)) && (!state.src || card.dataset.src === state.src);
    card.classList.toggle('hidden', !ok);
  }
  for (const sec of document.querySelectorAll('main section[data-sect]'))
    sec.classList.toggle('hidden', !sec.querySelector('.card[data-name]:not(.hidden)'));
}
// A filter the reader did not type has to take them to what it filtered: the
// skills live at the bottom of the page, so a chip or a skill pill that only
// re-rendered in place looked like it did nothing.
function revealSkills() {
  render();
  document.getElementById('skills')?.scrollIntoView({ block: 'start' });
}

// Section hides keep a group emptied by the filter from leaving a bare heading behind.
document.getElementById('q').addEventListener('input', render);
document.addEventListener('click', e => {
  const jump = e.target.closest('[data-jump]');
  if (jump) { e.preventDefault(); document.getElementById('q').value = jump.dataset.jump; revealSkills(); return; }
  const step = e.target.closest('[data-step]');
  if (step) {
    e.preventDefault();
    const id = step.dataset.step;
    state.sel = state.sel === id ? null : id;
    render();
  }
});
document.getElementById('legend').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  state.src = state.src === chip.dataset.src ? null : chip.dataset.src;
  revealSkills();
});

/* source legend + footer, built once */
(function shell() {
  const counts = {};
  for (const [, skills] of SECTIONS) for (const [, , s] of skills) counts[s] = (counts[s] || 0) + 1;
  document.getElementById('legend').innerHTML = Object.entries(SOURCES)
    .filter(([k]) => counts[k])
    .map(([k, s]) => `<span class="chip" data-src="${k}" style="color:${s.color}"><span class="dot" style="background:${s.color}"></span>${s.label} <b>${counts[k]}</b></span>`).join('');
  document.getElementById('foot').innerHTML = `One hand-maintained page: the loop, the two run shapes, the standing rules and the skills table.
    The loop and the run shapes are read from the <b>live</b> elements of <code>dev-workflow.excalidraw</code> and <code>diagram.excalidraw</code>,
    and the skills table is lifted from <code>skills-cheatsheet.html</code> — all three in the dotfiles repo, <code>docs/</code>.
    Clicking a skill pill filters to it; clicking a loop card opens what it produces.`;
  render();
})();
</script>
</body>
</html>
