<!DOCTYPE html>
<!--
  Prototype: three structurally different layouts for the attention dashboard,
  switchable via ?variant= (or #variant=). Data comes from the shared snapshot
  contract only — the same JSON `gh_attention_poc.py --json` writes and other
  tools render — so no attention rule lives in this file.
  Open http://127.0.0.1:8765/prototype (the POC serves this page and the JSON),
  or serve the folder yourself:  python3 gh_attention_poc.py --json attention.json
  then                          python3 -m http.server
  Question it answers: "what should this dashboard look like, and how should a
  refresh tell me what moved?"
  (A) buckets first — stacked sections; (B) urgency first — one unified queue;
  (C) container first — sidebar + detail pane.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE — GitHub attention dashboard</title>
<style>
  :root{
    --ink:#1a1a1a; --muted:#6b6b6b; --line:#e4e4e4; --bg:#fafafa;
    --accent:#0a6cff;
    --amber:#9a6400; --amber-bg:#fff4e0; --amber-line:#efd9ae;
    --red:#b3261e; --red-bg:#fdecea; --red-line:#f2c4bf;
    --green:#1a7f37; --green-bg:#e9f5ec; --green-line:#c6e2ce;
    --blue-bg:#e9f1ff; --blue-line:#c8dcff;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);padding-bottom:96px}
  .banner{background:#fff8dc;border-bottom:1px solid #eadfa8;padding:10px 24px;font-size:13px;color:#5c5310}
  .banner .k{font-weight:700;letter-spacing:.05em}
  .banner .cmp{font-weight:600}
  .banner code{background:#00000010;padding:0 4px;border-radius:4px}
  .banner button{font:inherit;font-size:12px;margin-left:8px;border:1px solid #d8c98a;background:#fffdf3;color:#5c5310;border-radius:6px;padding:2px 8px;cursor:pointer}
  .wrap{max-width:1120px;margin:0 auto;padding:18px 24px 40px}
  h1{font-size:20px;margin:14px 0 2px}
  .thesis{color:var(--muted);font-size:13px;margin:0 0 18px}
  h2.sec{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:26px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
  h2.sec .count{text-transform:none;letter-spacing:0;font-weight:400}
  .row{display:flex;align-items:baseline;gap:8px;padding:9px 6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .row:hover{background:#fff}
  .row .title{flex:1;min-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .title a{color:inherit;text-decoration:none}
  .row .title a:hover{text-decoration:underline}
  .row .meta{color:var(--muted);font-size:12.5px;white-space:nowrap}
  /* Change is a row-level, transient fact: a coloured edge plus plain meta text,
     never another chip next to the item's own states and facts. */
  .row.chg-new{border-left:3px solid var(--green)}
  .row.chg-moved{border-left:3px solid var(--amber)}
  .row.chg-moved.out{border-left-color:var(--green)}
  .row.chg-gone{border-left:3px solid #d0d0d0;opacity:.5}
  .row.chg-gone .title{text-decoration:line-through}
  .chg{font-weight:600;font-size:12.5px}
  .chg.new{color:var(--green)}
  .chg.moved{color:var(--amber)}
  .chg.moved.out{color:var(--green)}
  .chg.gone{color:var(--muted)}
  .kid{display:flex;align-items:baseline;gap:8px;padding:3px 6px 3px 26px;border-bottom:1px solid var(--line);font-size:13px}
  .kid a{color:var(--muted);text-decoration:none}
  .kid a:hover{text-decoration:underline}
  .chip{font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid transparent;white-space:nowrap;flex:none}
  .chip.warn{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-line)}
  .chip.bad{color:var(--red);background:var(--red-bg);border-color:var(--red-line)}
  .chip.good{color:var(--green);background:var(--green-bg);border-color:var(--green-line)}
  .chip.info{color:var(--accent);background:var(--blue-bg);border-color:var(--blue-line)}
  .chip.quiet{color:var(--muted);background:#f1f1f1;border-color:#e2e2e2}
  .chip.src{color:#555;background:#fff;border-color:#ddd}
  .hidden-note{font-size:12px;color:var(--muted);padding:5px 6px 0}
  .empty{color:var(--muted);font-size:13px;padding:6px}
  .summary{display:flex;gap:12px;margin:16px 0 6px;flex-wrap:wrap}
  .tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:130px}
  .tile .n{font-size:22px;font-weight:600}
  .tile .l{font-size:12px;color:var(--muted)}
  .tier-head{display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 2px;padding:0 6px;font-weight:600}
  .tier-head .t-sub{font-size:12.5px;color:var(--muted);font-weight:400}
  .split{display:grid;grid-template-columns:300px 1fr;gap:28px;align-items:start}
  .rail{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
  .rail button.item{display:block;width:100%;text-align:left;border:0;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;cursor:pointer;font:inherit;color:inherit}
  .rail button.item:last-child{border-bottom:0}
  .rail button.item:hover{background:#f7faff}
  .rail button.item.sel{background:#eef5ff}
  .rail .rname{font-weight:600;font-size:13.5px}
  .rail .rsub{font-size:12px;color:var(--muted);margin-top:2px}
  .rail .need{color:var(--amber);font-weight:600}
  .pane h2.sec:first-child{margin-top:4px}
  /* Always visible (a hover-only control is undiscoverable), but quiet until the
     row is hovered. */
  .stalewarn{color:var(--red);font-weight:600}
  .snooze{flex:none}
  .snooze select,.snooze button{font:inherit;font-size:11px;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:6px;padding:1px 5px;cursor:pointer}
  .row:hover .snooze select,.row:hover .snooze button{border-color:var(--line);background:#fff;color:var(--ink)}
  .wakeat{color:var(--muted);font-size:11px;margin-left:4px}
  .row.snoozed{opacity:.5}
  .help{margin:0;padding:0 0 0 18px;color:var(--muted);font-size:12.5px;max-width:980px}
  .help li{margin:5px 0}
  .switcher{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:#1d1d1f;color:#fff;border-radius:999px;display:flex;align-items:center;gap:12px;padding:9px 16px;box-shadow:0 8px 24px rgba(0,0,0,.28);font-size:13.5px;z-index:9}
  .switcher button{background:transparent;border:0;color:#fff;font-size:19px;line-height:1;cursor:pointer;padding:0 4px}
  .switcher .hint{color:#9a9a9f;font-size:12px}
  .missing{background:#fff;border:1px solid var(--red-line);border-radius:10px;padding:16px 18px;margin:20px 0}
  .missing b{color:var(--red)}
  .missing pre{background:#f6f6f6;border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow:auto}
</style>
</head>
<body>
  <div class="banner">
    <span class="k">PROTOTYPE.</span>
    Question: what should the attention dashboard look like, and how should a refresh tell me what moved?
    Rendering the shared snapshot JSON — no attention rules in this file.
    Flip layouts with <b>← →</b> or the bar below.
    <span class="cmp" id="cmp">loading…</span>
    <span class="stalewarn" id="stale"></span>
    <button id="refresh" title="Run the producer now — live gh/twg collection, ~20s">refresh</button>
  </div>
  <div class="wrap" id="app"></div>
  <div class="switcher">
    <button id="prev" aria-label="Previous variant">‹</button>
    <span id="variantLabel"></span>
    <button id="next" aria-label="Next variant">›</button>
    <span class="hint">← →</span>
  </div>

<script src="attention-view.js"></script>
<script>
/* ============================== the contract ==============================
   Everything below reads rows as the JSON snapshot defines them:
   {chip,key,title,ref,url,author,jira,container,labels,
    states:[{key,label,tier,tone}], facts:[{label,tone}], detail, age, times,
    tier, children:[...], change:{kind,label,from_*,to_*}}
   and changes:{previousAt, summary, items, gone:[row+section]}.
   No prState/age/tier computation here — that is the producer's job.         */
const VARIANTS = [['A','Stacked sections'],['B','Unified priority queue'],['C','Container sidebar + pane']];
const params = new URLSearchParams(location.search);
const hashV = (location.hash.match(/#variant=([ABC])/i) || [])[1];
let variant = ((params.get('variant') || hashV || 'A').toUpperCase());
if (!VARIANTS.some(v => v[0] === variant)) variant = 'A';

let DATA = null;
let cSelected = 'Yours';

/* ================================ helpers ================================ */
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function tone(t){ return ({ok:'good',bad:'bad',warn:'warn',info:'info'}[t]) || 'quiet'; }
function chipTone(chip){ return chip==='MY PR' ? 'good' : chip==='ISSUE' ? 'warn' : (chip==='JIRA'||chip==='MAIL') ? 'info' : 'src'; }

/* Shown at the end of every variant: the two things you have to know to use
   this page (where mail comes from, how to merge cards). */
const HELP = [
  'Mail — every starred thread shows up, archived ones included (is:starred), collected in the collapsed Mail fold instead of the tiers. Un-star one to clear it; nothing here changes your mail.',
  'Tiers — Needs you now: the ball is yours (review requests, failing checks, unresolved threads, replies owed, unstarted work). Ready when you are: nothing blocks you (approved and green PRs, merged work whose ticket may still need closing). Waiting on others: you handed off (PRs awaiting review, tickets in progress or with support, mail you answered).',
  'Grouping — two ways: a Jira key or GitHub ref links items into one card automatically (a merged PR stays with its ticket and lifts the card to Ready), and a group/&lt;name&gt; label merges threads that share nothing but the topic. The top line of a card is its most urgent member; the rest are children.',
  'Change marks — a coloured edge and small text mean "since your last look": new, moved (A → B), or dropped (struck through, and hidden in Needs you now).',
  'Snooze — pick a duration on any card (4 hours / 1 day / 3 days / 1 week): it parks in the Snoozed fold until then. Shared with the other dashboards; the snapshot itself is untouched.',
];
function helpHtml(){
  return `<details class="fold"><summary style="cursor:pointer;color:var(--muted);font-size:13px;margin:26px 0 6px">How this queue works</summary>
    <ul class="help">${HELP.map(l => `<li>${l}</li>`).join('')}</ul></details>`;
}
function short(repo){ return esc(String(repo||'').replace('Launchmetrics/','')); }

/* "Since I last looked" lives here, not in the producer: the snapshot carries
   when each row was first seen and last changed, this page carries when its
   reader last looked. First look flags nothing. */
/* The rules live in attention-view.js, shared with the POC page and the dsh
   panel: this file only lays cards out. */
const SEEN_KEY = 'gha.seenAt';
let seenAt = null;
try { seenAt = localStorage.getItem(SEEN_KEY); } catch (e) {}
let snoozes = {}, acks = {}, status = null, view = null;
let noBackend = !!params.get('data');    // static ?data= mode: no parking, no refresh

const changeMark = c => c ? `<span class="chg ${view.changeTone(c)}" title="changed since your last look">${esc(view.changeLabel(c))}</span>` : '';

function parkControl(r){
  if (noBackend) return '';
  const until = view.snoozeOf(r), acked = view.ackOf(r);
  if (until || acked)
    return `<span class="snooze"><button class="wake" onclick="park('${esc(r.key)}','${acked ? 'unack' : '0'}')">${acked ? 'unack' : 'wake'}</button>
      <span class="wakeat">${acked ? 'until it changes' : esc(view.formatWhen(until))}</span></span>`;
  return `<span class="snooze"><select onchange="if(this.value) park('${esc(r.key)}', this.value)">
    <option value="" selected>⏰ snooze / ack</option>
    ${view.choices.map(c => `<option value="${c.value}">${esc(c.label)}</option>`).join('')}</select></span>`;
}
async function park(key, value){
  const acking = value === 'ack', unacking = value === 'unack';
  const res = await fetch(acking || unacking ? '/acks' : '/snoozes', {
    method: 'POST', headers: {'content-type': 'application/json'},
    body: JSON.stringify(acking ? {key} : unacking ? {key, clear: true} : {key, hours: Number(value)})});
  const stored = await res.json();
  if (acking || unacking) acks = stored; else snoozes = stored;
  makeView(); render();
}
function makeView(){
  view = AttentionView.overlay(DATA, {seenAt, snoozes, acks});
  return view;
}
function meta(r){
  const ref = r.container
    ? `${short(r.container)}#${esc(String(r.ref||'').split('#').pop())}`
    : esc(r.ref || '');
  const parts = [ref,
          r.author && '@'+esc(r.author),
          r.detail && esc(r.detail),
          r.jira && esc(String(r.jira).split('/').pop())].filter(Boolean);
  // the ticket a card names is not a child card, so its status/summary ride here
  if (r.jira_issue) parts.push([r.jira_issue.status, r.jira_issue.type, r.jira_issue.summary]
    .filter(Boolean).map(esc).join(' · '));
  return parts.join(' · ');
}
function rowHtml(r){
  const chg = view.flag(r);
  const kids = (r.children||[]).map(c => `<div class="kid">
      <span class="chip ${chipTone(c.chip)}">${esc(c.chip)}</span>
      <a href="${esc(c.url||'#')}" target="_blank" rel="noreferrer" title="${esc(c.title || c.ref || '')}">${esc(c.ref || c.title || '')}</a>
      ${(c.states||[]).map(s=>`<span class="chip ${tone(s.tone)}">${esc(s.label)}</span>`).join('')}
      ${changeMark(view.flag(c))}
      ${c.detail ? `<span class="meta">${esc(c.detail)}</span>` : ''}
    </div>`).join('');
  return `<div class="row${view.changeClass(chg)}${view.parked(r) ? ' snoozed' : ''}">
    <span class="chip ${chipTone(r.chip)}">${esc(r.chip)}</span>
    <span class="title"><a href="${esc(r.url||'#')}" target="_blank" rel="noreferrer">${esc(r.title)}</a></span>
    ${(r.states||[]).map(s=>`<span class="chip ${tone(s.tone)}">${esc(s.label)}</span>`).join('')}
    ${(r.facts||[]).map(f=>`<span class="chip ${tone(f.tone)}">${esc(f.label)}</span>`).join('')}
    <span class="meta">${changeMark(chg)}${chg ? ' · ' : ''}${meta(r)}</span>
    <span class="meta">${esc(r.age||'')}</span>
    ${parkControl(r)}
  </div>${kids}`;
}
function tierHtml(t){
  const rows = t.rows;
  return `<h2 class="sec"><span>${esc(t.title)}</span><span class="count">${t.count}</span></h2>`
    + (rows.length ? rows.map(rowHtml).join('') : '<div class="empty">Nothing here.</div>');
}
function fold(title, rows){
  if (!rows.length) return '';
  return `<details class="fold"><summary style="cursor:pointer;color:var(--muted);font-size:13px;margin:18px 0 6px">${esc(title)} · ${rows.length}</summary>${rows.map(rowHtml).join('')}</details>`;
}
/* Parked buckets, then mail, then the log — the same order as the other surfaces. */
function foldHtml(){
  return fold('Snoozed', view.folds.snoozed)
    + fold('Acknowledged', view.folds.acked)
    + fold('Mail · starred threads', view.folds.mail)
    + fold('Drafts', view.folds.drafts)
    + fold('Recently closed', view.folds.closed);
}

/* =========================== A — buckets first =========================== */
function renderA(){
  let h = `<h1>Attention</h1>
  <p class="thesis">Variant A — <b>buckets first</b>. Tiered sections; changed cards are badged in place, dropped ones stay struck-through in their old tier for one refresh.</p>`;
  for (const t of view.tiers) h += tierHtml(t);
  h += foldHtml();
  if (DATA.hidden_bots) h += `<div class="hidden-note">+${DATA.hidden_bots} hidden (bot-authored review requests)</div>`;
  return h;
}

/* =========================== B — urgency first =========================== */
function renderB(){
  const tiles = view.tiers.map(t =>
    `<div class="tile"><div class="n">${t.count}</div><div class="l">${esc(t.title)}</div></div>`).join('');
  const counts = view.counts();
  let h = `<h1>Attention</h1>
  <p class="thesis">Variant B — <b>urgency first</b>. One queue in tier order; the tiles count the queue, not the sources.</p>
  <div class="summary">${tiles}
    <div class="tile"><div class="n">${counts.new + counts.changed}</div><div class="l">new or changed since your look</div></div>
    <div class="tile"><div class="n">${counts.gone}</div><div class="l">dropped since your look</div></div>
  </div>`;
  for (const t of view.tiers){
    h += `<div class="tier-head"><span>${esc(t.title)}</span><span class="t-sub">${t.count}</span></div>`
      + (t.rows.length ? t.rows.map(rowHtml).join('') : '<div class="empty">Nothing here.</div>');
  }
  h += foldHtml();
  return h;
}

/* ========================== C — container first ========================== */
function groupOf(r){
  if (r.container) return r.container;
  if (r.chip === 'JIRA') return 'Jira · ' + String(r.ref||'').split('-')[0];
  return r.chip || 'Other';
}
function isYours(r){ return r.chip === 'MY PR' || r.chip === 'ISSUE'; }
function renderC(){
  const all = view.tiers.flatMap(t => t.rows);
  const groups = {};
  all.forEach(r => (groups[groupOf(r)] ||= []).push(r));
  const yours = all.filter(isYours);
  const needsIn = rows => rows.filter(r => r.tier === 'needs').length;

  let rail = `<button class="item ${cSelected==='Yours'?'sel':''}" data-group="Yours">
      <div class="rname">★ Yours</div>
      <div class="rsub">${yours.length} card${yours.length===1?'':'s'}${needsIn(yours)?` · <span class="need">${needsIn(yours)} need you</span>`:''}</div></button>`;
  Object.keys(groups).sort((a,b) => needsIn(groups[b]) - needsIn(groups[a]) || groups[b].length - groups[a].length)
    .forEach(g => {
      const rows = groups[g], n = needsIn(rows);
      rail += `<button class="item ${cSelected===g?'sel':''}" data-group="${esc(g)}">
        <div class="rname">${short(g)}</div>
        <div class="rsub">${rows.length} card${rows.length===1?'':'s'}${n?` · <span class="need">${n} need you</span>`:''}</div></button>`;
    });

  const picked = cSelected === 'Yours' ? yours : (groups[cSelected] || []);
  let pane = '';
  for (const t of DATA.tiers){
    const rows = picked.filter(r => r.tier === t.key);
    if (!rows.length) continue;
    pane += `<h2 class="sec"><span>${esc(t.title)}</span><span class="count">${rows.length}</span></h2>` + rows.map(rowHtml).join('');
  }
  if (!pane) pane = '<div class="empty">Nothing here.</div>';

  return `<h1>Attention</h1>
  <p class="thesis">Variant C — <b>container first</b>. Repos, Jira projects, and any other grouping all get a rail home; "Yours" aggregates across containers.</p>
  <div class="split"><div class="rail">${rail}</div><div class="pane">${pane}</div></div>${foldHtml()}`;
}

/* ============================== switcher ================================= */
function setVariant(v){
  variant = v;
  try { history.replaceState(null, '', '?variant=' + v); } catch (e) { location.hash = 'variant=' + v; }
  render();
}
function cycle(d){
  const i = VARIANTS.findIndex(v => v[0] === variant);
  setVariant(VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length][0]);
}
function render(){
  document.getElementById('app').innerHTML = (variant === 'A' ? renderA : variant === 'B' ? renderB : renderC)();
  document.getElementById('app').insertAdjacentHTML('beforeend', helpHtml());
  document.getElementById('variantLabel').textContent = `${variant} — ${VARIANTS.find(v => v[0] === variant)[1]}`;
}
function missing(src, err){
  return `<div class="missing">
    <p><b>No snapshot at ${esc(src)}</b> (${esc(err && err.message || err)}).</p>
    <p>This page renders the shared JSON contract and holds no data of its own. Generate a snapshot and serve the folder:</p>
    <pre>python3 gh_attention_poc.py --json attention.json
python3 -m http.server</pre>
    <p>or just open <code>http://127.0.0.1:8765/prototype</code> — the POC server serves this page and a fresh snapshot.</p>
  </div>`;
}

/* ================================ boot ================================== */
function loading(){
  document.getElementById('app').innerHTML = '<div class="empty">loading the snapshot — a live collection takes a few seconds…</div>';
}
async function load(isRefresh){
  const src = params.get('data') || './attention.json';
  const cmp = document.getElementById('cmp');
  if (isRefresh) cmp.textContent = 'refreshing — live gh/twg collection, ~20s…';
  try {
    const res = await fetch(isRefresh ? '/refresh' : src, {cache:'no-store'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    DATA = await res.json();
    if (!noBackend) {
      const [snaps, ackRes, statusRes] = await Promise.all([
        fetch('/snoozes', {cache:'no-store'}), fetch('/acks', {cache:'no-store'}), fetch('/status', {cache:'no-store'})]);
      snoozes = await snaps.json().catch(() => ({}));
      acks = await ackRes.json().catch(() => ({}));
      status = await statusRes.json().catch(() => null);
    }
  } catch (e) {
    cmp.textContent = 'no snapshot';
    document.getElementById('app').innerHTML = missing(src, e);
    return;
  }
  makeView();
  const secs = Math.max(0, (Date.now() - Date.parse(DATA.generatedAt)) / 1000);
  const snapAge = secs < 60 ? 'just now' : secs < 3600 ? Math.floor(secs/60) + 'm ago'
                : secs < 86400 ? Math.floor(secs/3600) + 'h ago' : Math.floor(secs/86400) + 'd ago';
  const staleText = AttentionView.staleText(DATA, status);
  document.getElementById('stale').textContent = staleText ? '· ' + staleText : '';
  cmp.textContent = `${view.summaryText()} · snapshot ${snapAge} · schema v${DATA.schema}`;
  render();
  try { localStorage.setItem(SEEN_KEY, DATA.generatedAt); } catch (e) {}
}

  document.getElementById('app').addEventListener('click', e => {
  const item = e.target.closest('[data-group]');
  if (item){ cSelected = item.getAttribute('data-group'); render(); }
});
document.getElementById('prev').onclick = () => cycle(-1);
document.getElementById('next').onclick = () => cycle(1);
window.addEventListener('keydown', e => {
  const a = document.activeElement;
  if (a && (['INPUT','TEXTAREA'].includes(a.tagName) || a.isContentEditable)) return;
  if (e.key === 'ArrowLeft')  { e.preventDefault(); cycle(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); cycle(1); }
});
loading();
load();
document.getElementById('refresh').hidden = !!params.get('data');
document.getElementById('refresh').onclick = () => load(true);
</script>
</body>
</html>
