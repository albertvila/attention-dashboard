<!DOCTYPE html>
<!--
  Attention dashboard — the Briefing, the page the producer serves at /.

  It renders the shared snapshot contract only: the same JSON `attention.py
  --json` writes and other tools read. Every reader-side rule (change flags,
  ghosts, folds, grouping, parking, fold notes, the next-card line) comes from
  attention-view.js, so no attention rule lives in this file.

  One card renderer serves every place a card appears — a Needs block, a Ready
  line, a Waiting line, a group line, a fold line — so a layout
  cannot drop part of a card.

  Served by the producer (http://127.0.0.1:8765/).
-->
<html lang="en"><head><meta charset="utf-8"><title>Attention dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{color-scheme:light dark}
body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#0d1117;color:#e6edf3}
header{position:sticky;top:0;z-index:10;background:#0d1117f2;border-bottom:1px solid #30363d;padding:14px 20px 12px;backdrop-filter:blur(6px)}
.hrow{display:flex;gap:12px;align-items:center}
.brand{font-size:15px;font-weight:600}
button{background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:4px 12px;cursor:pointer;font:inherit}
button:hover{background:#30363d}
.navlink{color:#8b949e;border:1px solid #30363d;border-radius:6px;padding:4px 12px;text-decoration:none;white-space:nowrap;margin-left:auto}
.navlink:hover{color:#e6edf3;background:#21262d}
.date{margin:12px 0 0;color:#8b949e;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.sentence{font-size:24px;line-height:1.25;font-weight:400;margin:6px 0 4px;text-transform:none;letter-spacing:normal;color:#e6edf3}
.sub{margin:0;color:#8b949e;font-size:12px}
#jumped{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
#jumped button{font-size:11px;padding:1px 8px;color:#d29922;border-color:#d2992255;background:transparent}
main{max-width:1380px;margin:0 auto;padding:6px 26px 80px;display:grid;
  grid-template-columns:250px minmax(0,1fr) 262px;gap:26px;align-items:start}
/* Three columns wherever three fit: specs on the left (browse material — no
   counts, nothing parkable), the board in the middle, ongoing work on the
   right (live machine state). Only the stack loses the columns, and there
   specs reads first rather than after the board — a rail at the foot of a
   short screen is a rail nobody scrolls to. */
@media (max-width:1000px){main{grid-template-columns:1fr}#sessions{order:2}#specs{order:-1}}
#app{min-width:0}
.rail{position:sticky;top:120px;border:1px solid #30363d;border-radius:8px;padding:12px 14px;background:#0d1117}
.rail h2{margin:0 0 4px}
.team{margin-top:14px;padding-top:10px;border-top:1px solid #30363d;display:flex;flex-direction:column;gap:4px}
.teammate{display:flex;gap:6px;align-items:center;width:100%;text-align:left;background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:8px;padding:3px 8px 3px 3px;cursor:pointer;font:inherit;font-size:12px}
.teammate.on{border-color:#d29922;color:#e3b341}
.teammate img{width:20px;height:20px;border-radius:50%;background:#30363d}
body.viewing #specs{display:none}
body.viewing main{grid-template-columns:minmax(0,1fr) 262px}
body.viewing #sessions > :not(.team){display:none}
.viewing-banner{color:#e3b341;font-size:13px;margin:8px 0 0}
.viewing-banner button{background:transparent;color:#79c0ff;border:0;padding:0;cursor:pointer;font:inherit}
.railtip{margin:0 0 8px;color:#8b949e;font-size:11.5px;line-height:1.4}
a.spec{display:flex;gap:7px;align-items:flex-start;padding:8px 0;border-top:1px solid #21262d;text-decoration:none;color:#e6edf3}
a.spec:hover .spectitle{text-decoration:underline}
/* The writer's face, and their name on hover: the only thing the rail fetches
   from anywhere but this machine, and a row without it reads fine. */
.specav{width:16px;height:16px;border-radius:50%;flex:0 0 auto;background:#30363d;margin-top:1px}
.spectext{min-width:0}
.specgroup{margin:11px 0 3px;color:#8b949e;font-size:11px;font-weight:600}
.specref{display:block;color:#79c0ff;font-size:11px;margin-bottom:2px}
.spectitle{display:block;font-size:12.5px;line-height:1.35}
.specage{display:block;color:#8b949e;font-size:11px;margin-top:3px}
/* One box per repository with a session open on it, in the right rail, outside
   every card — the work should be visible from across the room. */
.sessioncol{display:flex;flex-direction:column;gap:5px;padding:11px 13px;margin-top:8px;
  border:1px solid #3fb95055;border-left:3px solid #3fb950;border-radius:8px;
  background:#3fb9500d;color:#e6edf3}
.sessioncol .collabel{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#7ee787;font-weight:700}
.sessioncol .colstate{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:#7ee787}
.sessioncol .colstate .dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.sessioncol .colline{display:flex;gap:6px;align-items:baseline;font-size:11.5px;color:#8b949e;overflow-wrap:anywhere}
.sessioncol .csrc{color:#6e7681;font-size:10px;margin-left:5px;white-space:nowrap}
.sessioncol .slinks{margin-left:auto;display:flex;gap:4px;flex:0 0 auto}
.sessioncol .slink{font-size:10.5px;line-height:1.6;padding:0 7px;border-radius:999px;border:1px solid #30363d;
  background:transparent;color:#8b949e;cursor:pointer;font-family:inherit;white-space:nowrap}
.sessioncol .slink:hover{color:#e6edf3;border-color:#8b949e;background:#21262d}
.sessioncol .slink.ok{border-color:#7ee787;color:#7ee787}
.sessioncol .slink.bad{border-color:#f85149;color:#ff7b72}
.sessioncol .slink.busy{opacity:.6;cursor:progress}
.sessioncol.idle{border-color:#30363d;border-left-color:#8b949e55;background:#8b949e0d}
.sessioncol.idle .collabel{color:#8b949e}
.sessioncol.idle .colstate{color:#c9d1d9}
.sessioncol.busy{border-color:#d2992255;border-left-color:#d29922;background:#d299220d}
.sessioncol.busy .collabel,.sessioncol.busy .colstate{color:#e3b341}
section{margin:26px 0}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#8b949e;margin:0 0 10px;font-weight:600}
/* One card renderer, two emphases: a generous 'block' for the Needs tier a
   reader must actually read, a terse 'line' for Ready, Waiting and the folds.
   Both carry the same parts — states, facts, labels, jira line, links, age,
   parking — the layout only chooses emphasis. A line's name owns a line of its
   own, so the meta line under it starts at the same edge in every card: the
   repo, key and author never land wherever they happen to fit. */
.row{display:flex;gap:10px;align-items:flex-start;border-left:3px solid #30363d}
.body{min-width:0}
.block{padding:2px 2px 14px 14px;margin-bottom:16px}
.block>.chip{margin-top:3px}
.block .body{flex:1;display:flex;flex-direction:column}
.block .title{font-size:18px;font-weight:600;line-height:1.3}
.block .meta{margin-top:7px;font-size:12.5px}
.block .jira-line{margin-top:5px}
.block .labels{margin-top:6px}
.block .foot{margin-top:10px}
.line{padding:8px 2px 8px 8px;border-bottom:1px solid #21262d}
.line>.chip{align-self:center}
.line .body{flex:1;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.line .title{flex:1 1 100%;align-items:center}
.line .title a{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.line .meta{display:flex;gap:6px;align-items:center;font-size:12px}
.title{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;min-width:0}
.title a{color:#e6edf3;text-decoration:none}
.title a:hover{text-decoration:underline}
.foot{display:flex;gap:10px;align-items:center;margin-left:auto}
.age{flex:0 0 auto;color:#8b949e;font-size:12px}
.chip{flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.05em;padding:2px 6px;border-radius:4px;background:#30363d;color:#c9d1d9}
.chip.REVIEW{background:#1f6feb33;color:#79c0ff}
.chip.REVIEWED{background:#58a6ff22;color:#79c0ff}
.chip.MY{background:#23863633;color:#7ee787}
.chip.ISSUE{background:#d2992233;color:#e3b341}
.chip.JIRA{background:#8957e533;color:#d2a8ff}
.chip.mini{font-size:9px;padding:1px 5px}
.meta{color:#8b949e;font-size:12px;overflow-wrap:anywhere}
.author,.repo{color:#8b949e;text-decoration:none}
.author:hover,.repo:hover{color:#e6edf3;text-decoration:underline}
.avatar{width:16px;height:16px;border-radius:50%;vertical-align:-3px;margin-right:4px;background:#30363d}
.avatar-link{text-decoration:none;line-height:0}
.jira{color:#79c0ff;text-decoration:none}
.jira:hover{text-decoration:underline}
.jira-line{margin-top:4px;font-size:12px;overflow-wrap:anywhere}
.jira-type{color:#8b949e;margin-left:6px;font-size:11px}
.jira-summary{color:#c9d1d9;margin-left:6px}
.jira-line .badge{margin-left:6px;vertical-align:1px}
/* What holds a card up: the words are the signal, the key is the link. */
.blocked .blocked-label{color:#e3b341;font-size:11px;margin-right:6px}
.linked .link-label{color:#8b949e;font-size:11px;margin-right:6px}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid transparent}
.badge.needs{background:#f851491f;color:#ff7b72;border-color:#f8514955}
.badge.ready{background:#3fb9501f;color:#7ee787;border-color:#3fb95055}
.badge.waiting{background:#8b949e1f;color:#8b949e;border-color:#8b949e55}
.badge.wip{background:#d299221f;color:#e3b341;border-color:#d2992255}
.badge.draft{background:#8b949e26;color:#c9d1d9;border-color:#8b949e88;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.labels{margin-top:4px}
.gh-label{display:inline-block;font-size:10px;font-weight:600;padding:1px 7px;border-radius:10px;margin:0 4px 2px 0;border:1px solid #00000033}
.fact{display:inline-block;font-size:10px;font-weight:600;padding:1px 7px;border-radius:10px;border:1px solid;margin-left:4px;vertical-align:1px}
.fact.ok{color:#7ee787;border-color:#3fb95055;background:#3fb95011}
.fact.info{color:#79c0ff;border-color:#1f6feb55;background:#1f6feb11}
.fact.bad{color:#ff7b72;border-color:#f8514955;background:#f8514911}
.fact.warn{color:#e3b341;border-color:#d2992255;background:#d2992211}
.fact.waiting{color:#8b949e;border-color:#8b949e55;background:#8b949e11}
.fact.quiet{color:#8b949e;border-color:#8b949e44;background:#8b949e0d}
/* Linked items are a count at the row's right, beside age and parking — never a
   left-edge twisty, which reads as "this row is a child of the one above". */
.kidpill{flex:0 0 auto;font-size:10.5px;line-height:1.6;padding:0 8px;border-radius:10px;color:#8b949e;background:transparent;border:1px solid #30363d;white-space:nowrap;cursor:pointer}
.kidpill:hover{color:#e6edf3;border-color:#8b949e}
.kidpill.open{color:#c9d1d9;border-color:#8b949e;background:#1b2028}
.children{display:grid;gap:4px;margin-top:8px;border-left:2px solid #30363d;padding-left:10px}
.line .children{flex-basis:100%}
.child{display:flex;align-items:center;gap:6px;padding:2px 0;font-size:12px;flex-wrap:wrap}
.child a{color:#8b949e;text-decoration:none}
.child a:hover{color:#e6edf3;text-decoration:underline}
.child .gh-label{font-size:9px;padding:0 6px}
.child .fact{font-size:9px;padding:0 6px}
.child-detail{color:#8b949e;font-size:11px}
.child-age{margin-left:auto;color:#6e7681;font-size:11px}
/* Always visible (a hover-only control is undiscoverable), but quiet until the
   row is hovered. */
.snooze{flex:0 0 auto}
.snooze select,.snooze button{font:inherit;font-size:11px;background:transparent;color:#6e7681;border:1px solid transparent;border-radius:6px;padding:1px 6px;cursor:pointer}
.row:hover .snooze select,.row:hover .snooze button{background:#21262d;color:#c9d1d9;border-color:#30363d}
.wakeat{color:#6e7681;font-size:11px;margin-left:4px}
.row.snoozed{opacity:.5}
/* Change is a row-level, transient fact: a coloured edge plus plain meta text,
   never another chip next to the item's own states and facts. */
.row.chg-new{border-left-color:#3fb950}
.row.chg-moved{border-left-color:#d29922}
.row.chg-moved.out{border-left-color:#3fb950}
.row.chg-gone{border-left-color:#6e7681;opacity:.5}
.row.chg-gone .title a{text-decoration:line-through}
/* Finished work still riding in a live card, header row or linked child: struck
   like a ghost, since the state badge already says how it ended. */
.row.done .title a,.child.done a{text-decoration:line-through}
.row.draft{border-left-style:dashed;opacity:.72}
.chg{font-weight:600}
.chg.new{color:#7ee787}
.chg.moved{color:#e3b341}
.chg.moved.out{color:#7ee787}
.chg.gone{color:#8b949e}
details.fold{margin:18px 0 0;border-top:1px solid #21262d}
details.fold summary{cursor:pointer;font-size:13px;color:#c9d1d9;padding:9px 2px;list-style-position:inside}
details.fold summary b{font-weight:600}
details.fold .fold-note{color:#6e7681}
details.group{margin:0 0 6px;border-bottom:1px solid #21262d}
details.group summary{cursor:pointer;font-size:13.5px;color:#c9d1d9;padding:8px 2px;list-style-position:inside}
details.group summary b{font-weight:600}
.empty{color:#6e7681;font-size:13px;padding:4px 2px}
.hidden{color:#8b949e;font-size:12px;margin-top:6px}
.err{border:1px solid #f85149;border-radius:8px;background:#f8514911;padding:10px 12px;margin-bottom:8px}
details.err summary{cursor:pointer;color:#ff7b72;font-weight:600}
pre{white-space:pre-wrap;margin:6px 0 0;font-size:12px;color:#c9d1d9;max-height:180px;overflow:auto}
.help{margin:0;padding:0 0 0 18px;color:#8b949e;font-size:12.5px}
.help li{margin:5px 0}
</style></head><body>
<header>
  <div class="hrow"><span class="brand">Attention</span><button id="refresh">Refresh</button><a class="navlink" href="/reference">Reference</a></div>
  <p id="day" class="date"></p>
  <h1 id="sentence" class="sentence"></h1>
  <p id="stamp" class="sub">loading…</p>
  <p id="jumped" class="sub"></p>
</header>
<main>
  <aside id="specs" class="rail"></aside>
  <div id="app"></div>
  <aside id="sessions" class="rail"></aside>
</main>
<script src="attention-view.js"></script>
<script>
const app = document.getElementById('app');
const specsRail = document.getElementById('specs');
const sessionsRail = document.getElementById('sessions');
const stamp = document.getElementById('stamp');
const day = document.getElementById('day');
const sentence = document.getElementById('sentence');
/* The rules live in attention-view.js: this page only renders what the overlay
   hands it. */
const SEEN_KEY = 'gha.seenAt';
const viewing = (() => { try { return new URLSearchParams(location.search).get('user') || ''; } catch(e) { return ''; } })();
if(viewing) document.body.classList.add('viewing');
/* A look at a snapshot older than this refreshes it, live collection and all,
   and the header says the rule from this same number, so they cannot drift. */
const STALE_MS = 60 * 60 * 1000;
const STALE_LABEL = STALE_MS / 3600000 + 'h';
/* How often a visible tab looks: the gate above still decides whether that look
   refreshes or only stamps. */
const SWEEP_MS = 5 * 60 * 1000;
let seenAt = null;
try { seenAt = localStorage.getItem(SEEN_KEY); } catch(e) {}
let snoozes = {}, acks = {}, status = null, view = null;
let sessions = {}, specs = [], sessionErrors = [], specErrors = [];
let snap = null, refreshing = false, looking = false;
/* Whether this look's own read of each rail has landed: until it has, a rail
   with nothing to show says it is reading rather than saying it is empty. */
let specsRead = false, sessionsRead = false;

/* The last look belongs to a reader who is actually looking: a hidden or
   restored tab records nothing, and coming back to a snapshot older than
   STALE_MS refreshes it instead. Focus is one trigger; a visible page also
   sweeps, so a tab left open on a screen does not rot while you watch it. */
function stampSeen(){
  if(viewing || document.visibilityState !== 'visible' || !snap) return;
  try { localStorage.setItem(SEEN_KEY, snap.generatedAt); } catch(e) {}
}
function look(){
  if(document.visibilityState !== 'visible') return;
  if(!snap){ looking = true; return; }
  if(Date.now() - Date.parse(snap.generatedAt) > STALE_MS){ load(true); return; }
  stampSeen();
}

async function load(isRefresh){
  if(isRefresh && refreshing) return;
  if(isRefresh) refreshing = true;
  stamp.textContent = isRefresh ? 'refreshing — live gh/twg collection, ~5s…' : 'loading…';
  try{
    const queueUrl = viewing
      ? '/queue?login=' + encodeURIComponent(viewing)
      : (isRefresh ? '/refresh' : '/api/queue');
    /* Every read goes out in one wave, and the board waits only for what the
       board is made of: the queue, parking, and the stamp it sits under. The
       three rails are read per request and paint themselves when their own read
       lands — a gh search on the specs rail is a second of network for a rail
       that is not the queue, so it must not hold up the queue. On a refresh the
       queue read is a live collection, which is why nothing waits behind it. */
    const reads = {
      sessions: viewing ? Promise.resolve({}) : fetch('/sessions', {cache:'no-store'}).then(r => r.json()).catch(() => ({})),
      specs: viewing ? Promise.resolve({}) : fetch('/specs', {cache:'no-store'}).then(r => r.json()).catch(() => ({})),
      team: fetch('/team', {cache:'no-store'}).then(r => r.json()).catch(() => []),
    };
    const [res, snaps, acksRes, statusRes] = await Promise.all([
      fetch(queueUrl, {cache:'no-store'}),
      fetch('/snoozes', {cache:'no-store'}), fetch('/acks', {cache:'no-store'}),
      fetch('/status', {cache:'no-store'})]);
    const data = await res.json();
    snoozes = await snaps.json().catch(() => ({}));
    acks = await acksRes.json().catch(() => ({}));
    status = await statusRes.json().catch(() => null);
    snap = data;
    /* The rails' previous read, not this one: a rail that already has rows keeps
       them until the new ones land, and only a first look says it is reading. */
    view = AttentionView.overlay(data, {seenAt: viewing ? null : seenAt, snoozes, acks, specs});
    render(data);

    /* Each rail lands on its own, and the specs are the rules' own list: they
       are what says a rail row is already on the board, so the view is rebuilt
       with them rather than the rail guessing. */
    reads.specs.then(backlog => {
      specsRead = true;
      specs = backlog.issues || []; specErrors = backlog.errors || [];
      view = AttentionView.overlay(snap, {seenAt: viewing ? null : seenAt, snoozes, acks, specs});
      paintSpecs();
    });
    reads.sessions.then(live => {
      sessionsRead = true;
      sessions = live.repos || {}; sessionErrors = live.errors || [];
      paintSessions();
    });
    /* Who is on the teams you listed, and whether the switch is even on: read
       with the rest of the live state, so flipping it in config.json lands on
       the next look rather than the next page load. It only paints the Team
       box, so it lands when it lands. */
    reads.team.then(roster => {
      team = Array.isArray(roster) ? roster : [];
      paintTeam();
    });
    /* The Briefing opens with the sentence; the snapshot's own stamp stays
       underneath it. */
    day.textContent = new Date(data.generatedAt).toLocaleDateString([], {weekday:'long', day:'numeric', month:'long'});
    sentence.textContent = viewing ? (viewing + ' \u00b7 ' + view.summaryText()) : view.summaryText();
    const banner = document.getElementById('viewing');
    if(banner) banner.remove();
    if(viewing){
      const note = el('p', 'viewing-banner');
      note.id = 'viewing';
      note.appendChild(document.createTextNode('Viewing ' + viewing + ' \u00b7 read only \u00b7 '));
      const back = el('button', null, 'back to you');
      back.onclick = () => { location.search = ''; };
      note.appendChild(back);
      sentence.parentNode.insertBefore(note, sentence);
    }
    stamp.textContent = 'snapshot ' + ageOf(data.generatedAt)
      + ((data.producer || {}).code ? ' · producer ' + data.producer.code : '')
      + ' · refreshes itself on focus or on a visible sweep once it is over ' + STALE_LABEL + ' old';
    if(looking){ looking = false; look(); } else stampSeen();
  }catch(e){
    app.innerHTML = '';
    app.appendChild(errBox({where:'page', command:'GET /api/queue', output:String(e)}));
    stamp.textContent = 'error';
  }finally{
    if(isRefresh) refreshing = false;
  }
}

/* The Briefing's order: the sentence first, then Needs as blocks, then Ready and
   Waiting as rows (Waiting in the groups the rules hand back), then the folds.
   Every card goes through card(); a layout chooses emphasis and arrangement,
   never which parts of a card exist. */
/* A refresh rebuilds the page. Without this, the scroll position and every
   fold you had open are gone, which is what losing your place actually is. */
function place(){
  const open = new Set();
  document.querySelectorAll('details[data-keep][open]').forEach(d => open.add(d.dataset.keep));
  document.querySelectorAll('.row[data-key] .children').forEach(n => open.add('kids:' + n.closest('.row').dataset.key));
  return {y: window.scrollY, open};
}
function restore(saved){
  if(!saved) return;
  document.querySelectorAll('details[data-keep]').forEach(d => { if(saved.open.has(d.dataset.keep)) d.open = true; });
  document.querySelectorAll('.row[data-key]').forEach(row => {
    if(saved.open.has('kids:' + row.dataset.key)){
      const b = row.querySelector('.kidpill');
      if(b) b.click();
    }
  });
  if(window.scrollTo) window.scrollTo(0, saved.y);
}
function render(data){
  const saved = place();
  app.innerHTML = '';
  const staleText = AttentionView.staleText(data, status);
  if(staleText) app.appendChild(el('div','err', staleText));
  /* A failed source means a smaller queue, not a smaller workload: say so
     before the tiers, not after the help box. */
  /* A missing CLI is a source that is off on this machine, not a break — but it
     still makes the queue partial, so it stays loud and names the tool to add. */
  for(const e of data.errors) app.appendChild(errBox(e, e.missing
    ? '\u26a0 ' + e.where + ' is off: ' + e.missing + ' is not installed — this queue is partial (Run it yourself in the README)'
    : '\u26a0 ' + e.where + ' failed — this queue is partial'));
  for(const tier of view.tiers){
    const s = document.createElement('section');
    s.appendChild(el('h2', null, tier.title + ' · ' + tier.count));
    if(!tier.rows.length){
      s.appendChild(el('div','empty', tier.key === 'needs' ? view.nextCard() : 'Nothing here.'));
    }else{
      for(const it of tier.rows) s.appendChild(card(it, tier.key === 'needs' ? 'block' : 'line'));
    }
    app.appendChild(s);
  }
  for(const fold of [['Parked', view.folds.parked, view.notes.parked()],
                     ['Drafts', view.folds.drafts, view.notes.drafts()],
                     ['Recently closed', view.folds.closed, '']]){
    if(fold[1].length) app.appendChild(foldBox(fold[0], fold[1], fold[2]));
  }
  if(data.hidden_bots) app.appendChild(el('div','hidden','+'+data.hidden_bots+' hidden (bot-authored review requests)'));
  app.appendChild(helpBox([
    'Reading order — the Briefing reads top to bottom: a dated sentence saying what is new, changed and dropped since your last look, then Needs you now as generous blocks, then Ready when you are and Waiting on others as one-line rows, then the collapsed folds.',
    'Tiers — Needs you now: the ball is yours (review requests, failing checks, unresolved threads, replies owed, unstarted work). Ready when you are: nothing blocks you (approved and green PRs, tickets to deploy — and a card whose merged member finished while its ticket or issue still waits, that finished work struck underneath). Waiting on others: you handed off (PRs awaiting review, tickets in progress). When Needs is empty, its line names the next card that could be picked up.',
    'Folds — a card in a fold is not in a tier count. Every fold shows its count and the description the rules give it (the oldest age, conflicted drafts, the parked kinds); a fold with no note shows its count only.',
    'Linking — a card with linked items carries its count at the row\'s right, N linked, beside age and parking, expanding them in place; a card with no links carries no count, and a linked child keeps its own chip, ref, states, facts, labels, detail and age — struck when it has closed, so finished work riding in a live card never reads as work you just picked up. A Jira link that is not a dependency gets a line of its own under the card: linked KEY, its type, its status and its summary, open tickets first, so the ticket you raised with another team and are waiting on is readable without opening Jira. Two Jira tickets linked to each other are one card too; when one is a Fireline alert (the FIRE- project), the other names the card and lands it, and the alert rides underneath.',
    'Ongoing work — the right rail, one box per repository with an agent session open on it: one row per session, green while an agent is working, amber when blocked, grey when the pane is merely open, with herdr / bb buttons that open that session (herdr focuses the pane\'s tab; bb opens the thread and raises the bb window). Sessions are read live from herdr and bb every time you look. The repository name is the only join a card has to a session — a Jira card names no repository, so nothing joins to it.',
    'Specs — the left rail lists the open issues I wrote with the spec label that nobody has taken (no assignee): a backlog, so they never count in a tier and cannot be parked. An assignee means someone is already on it — usually me, which is why those are already on the board. In the repos config.json names under specRepos it reads everyone\'s spec instead, because a teammate\'s proposal is worth reading before somebody takes it, and when both are in play the rail keeps them apart — Mine above Watched repos — each row showing the writer\'s avatar, their login on hover. One that the queue is showing anyway reads "already on the board".',
    'Change marks — a coloured edge and small text mean "since your last look": new, moved (A → B), or dropped. A card that changed section is also a button under the sentence, so you can jump to where it went. A refresh keeps your scroll and the folds you had open. Work that has closed is never new, wherever it rides. A card that left the queue renders as struck history in the section it left — no state pills and no facts, just what it was and when it went; unless its linked items are all still live, in which case they already carry it and it does not render at all.',
    'Parking — the picker on each card snoozes it until a time (4 hours / 1 day / 3 days / 1 week) or acknowledges it until the card changes. Both kinds leave the tiers and collect in the collapsed Parked fold, counted in the header line; expand it to wake one or unack it.'
  ]));
  paintSpecs();
  paintSessions();
  const jumped = document.getElementById('jumped');
  jumped.innerHTML = '';
  for(const r of view.changedRows()){
    const b = el('button', null, (r.ref || r.title) + ' · ' + view.changeLabel(view.flag(r)));
    b.onclick = () => {
      const hit = document.querySelector('[data-key="' + CSS.escape(r.key) + '"]');
      if(hit) hit.scrollIntoView({block: 'center'});
    };
    jumped.appendChild(b);
  }
  restore(saved);
}

/* Every card carries its count and the note the rules give it; a fold the rules
   have nothing to say about shows its count only. */
function foldBox(title, items, note){
  const d = document.createElement('details');
  d.className = 'fold';
  d.dataset.keep = 'fold:' + title;
  const s = document.createElement('summary');
  s.appendChild(el('b', null, title));
  s.appendChild(document.createTextNode(' · ' + items.length));
  if(note) s.appendChild(el('span','fold-note',' — ' + note));
  d.appendChild(s);
  for(const it of items) d.appendChild(card(it, 'line'));
  return d;
}

/* ---------- what is open on a card: sessions and specs ----------------------
   Sessions are live machine state (a pane is open now or it is not) and specs
   are a backlog nobody is waiting on, so both are read per request and joined to
   the board here. Neither is in the snapshot. */

/* Every session says where it can be opened: a herdr pane, a bb thread, or both
   when the pane sits inside a bb environment. */
function sessionLinks(s){
  const out = [];
  if(s.herdr && s.herdr.tab) out.push({kind:'herdr', target: s.herdr.tab, label:'herdr',
                                       cmd:'herdr tab focus ' + s.herdr.tab});
  if(s.bb && s.bb.thread) out.push({kind:'bb', target: s.bb.thread, label:'bb',
                                    cmd:'bb thread open ' + s.bb.thread});
  return out;
}
const originOf = s => s.origin === 'bb' ? ('bb' + (s.bb && s.bb.thread ? ' ' + s.bb.thread.slice(0, 12) : '')) : 'herdr';
const stateLine = live => {
  const seen = new Map();
  for(const s of live) seen.set(s.agent + ' ' + s.state, (seen.get(s.agent + ' ' + s.state) || 0) + 1);
  return [...seen.entries()].map(([k, n]) => k + (n > 1 ? ' \u00d7' + n : '')).join(' · ');
};

/* Opening a session moves the window the reader is looking at, so the server
   takes a POST for it, and the link answers in its own chrome — a flash, never
   a rewritten label. */
async function focusSession(btn, link){
  btn.classList.add('busy');
  let out = {};
  try{
    const res = await fetch('/focus', {method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({kind: link.kind, target: link.target})});
    out = await res.json();
  }catch(e){ out = {ok:false, error:String(e)}; }
  btn.classList.remove('busy');
  btn.classList.add(out.ok ? 'ok' : 'bad');
  btn.title = out.ran ? 'ran: ' + out.ran : (out.error || link.cmd);
  setTimeout(() => btn.classList.remove('ok','bad'), 1500);
}

/* A repository's session box in the right rail: one row per session, and every
   row opens its own session. Working is green, blocked amber, a pane merely left
   open grey — an idle session must not read as work in progress. The repository
   is the box's label because it is also the only thing a card can join to: a
   Jira card names no repo, so nothing joins to it. */
function sessionBox(repo, live){
  const tone = !live.some(s => s.busy) ? 'idle'
    : (live.some(s => s.state === 'blocked') ? 'busy' : '');
  const col = el('div','sessioncol ' + tone);
  col.appendChild(el('span','collabel', repo.split('/').pop()));
  const state = el('span','colstate');
  state.appendChild(el('i','dot'));
  state.appendChild(document.createTextNode(stateLine(live)));
  col.appendChild(state);
  for(const s of live){
    const links = sessionLinks(s);
    const line = el('span','colline');
    const label = el('span');
    label.appendChild(document.createTextNode(s.label || s.agent + ' ' + s.state));
    label.appendChild(el('span','csrc', originOf(s)));
    line.appendChild(label);
    if(links.length){
      const wrap = el('span','slinks');
      for(const link of links){
        const b = el('button','slink', link.label);
        b.title = link.cmd;
        b.onclick = () => focusSession(b, link);
        wrap.appendChild(b);
      }
      line.appendChild(wrap);
    }
    col.appendChild(line);
  }
  col.title = repo + '\n' + live.map(s => s.agent + ' ' + s.state + (s.label ? ' — ' + s.label : '')
    + ' [' + originOf(s) + ']').join('\n');
  return col;
}

/* Every repository with a session open on it right now, one box each. Read live
   from herdr and bb at every look, so this rail is machine state and never part
   of the snapshot; a failed read costs the rail, never the queue. */
function paintSessions(){
  const repos = Object.entries(sessions || {}).filter(([, live]) => live.length);
  sessionsRail.innerHTML = '';
  sessionsRail.appendChild(el('h2', null, 'Ongoing work \u00b7 '
    + repos.reduce((n, [, live]) => n + live.length, 0)));
  sessionsRail.appendChild(el('p','railtip','Agent sessions open right now, one box per repository: green while an agent works, amber blocked, grey merely open. A card whose repository is here is being worked on.'));
  for(const e of sessionErrors) sessionsRail.appendChild(el('p','railtip','\u26a0 ' + e.where + ' failed'));
  if(!viewing && !repos.length && !sessionErrors.length) sessionsRail.appendChild(el('p','railtip',
    sessionsRead ? 'No session open right now.' : 'Reading what is open right now\u2026'));
  if(!viewing) for(const [repo, live] of repos) sessionsRail.appendChild(sessionBox(repo, live));
  paintTeam();
}

let team = [];
function paintTeam(){
  const old = sessionsRail.querySelector('.team');
  if(old) old.remove();
  if(!team.length) return;      // no teams listed, or the stalker switched off: no box, no way in
  const box = el('div', 'team');
  box.appendChild(el('h2', null, 'Team'));
  const you = el('button', 'teammate' + (viewing ? '' : ' on'), 'You');
  you.onclick = () => { location.search = ''; };
  box.appendChild(you);
  for(const p of team){
    const b = el('button', 'teammate' + (p.login === viewing ? ' on' : ''));
    const img = document.createElement('img');
    img.alt = ''; img.src = 'https://github.com/' + encodeURIComponent(p.login) + '.png?size=64';
    b.appendChild(img);
    b.appendChild(document.createTextNode(p.name.split(' ')[0]));
    b.title = p.name;
    b.onclick = () => {
      const u = new URL(location.href);
      u.searchParams.set('user', p.login);
      location.href = u;
    };
    box.appendChild(b);
  }
  sessionsRail.appendChild(box);
}

/* The specs rail: issues with the spec label that nobody has taken, waiting for
   nobody — mine, plus everyone's in the repos config.json names. Those are two
   readings, not one, so when both have something they say so. Browse material
   beside the board — no tier counts, nothing in it can be parked. The list comes
   from the rules, not the raw read: `onBoard` is theirs to decide. */
function specRow(s){
  const a = document.createElement('a');
  a.className = 'spec'; a.href = s.url; a.target = '_blank'; a.rel = 'noreferrer';
  if(s.author){
    const av = document.createElement('img');
    av.className = 'specav';
    av.src = 'https://github.com/' + encodeURIComponent(s.author) + '.png?size=32';
    av.alt = ''; av.title = s.author; av.width = 16; av.height = 16; av.loading = 'lazy';
    av.onerror = () => av.remove();     // offline is a row without a face, not a broken glyph
    a.appendChild(av);
  }
  const text = el('span','spectext');
  text.appendChild(el('span','specref', s.repo.split('/').pop() + '#' + s.number));
  text.appendChild(el('span','spectitle', s.title));
  text.appendChild(el('span','specage', 'opened ' + ageOf(s.updated)
    + (s.onBoard ? ' · already on the board' : '')));
  a.appendChild(text);
  return a;
}

function paintSpecs(){
  const list = (view && view.specs) || [];
  const mine = list.filter(s => !s.watched), watched = list.filter(s => s.watched);
  specsRail.innerHTML = '';
  specsRail.appendChild(el('h2', null, 'Specs · ' + list.length));
  specsRail.appendChild(el('p','railtip', watched.length
    ? 'Open issues with the spec label that nobody has taken: mine, and every one in the repos this dashboard watches — whoever wrote it. A backlog, not the queue.'
    : 'Open issues I wrote with the spec label that nobody has taken: no assignee. A backlog, not the queue.'));
  for(const err of specErrors) specsRail.appendChild(el('p','railtip', err.missing
    ? '\u26a0 ' + err.where + ' is off: ' + err.missing + ' is not installed'
    : '\u26a0 ' + err.where + ' failed'));
  if(!list.length && !specErrors.length) specsRail.appendChild(el('p','railtip',
    specsRead ? 'No open spec issues.' : 'Reading the backlog\u2026'));
  /* One list only when there is nothing to tell apart. */
  if(!mine.length || !watched.length){
    list.forEach(s => specsRail.appendChild(specRow(s)));
    return;
  }
  specsRail.appendChild(el('div','specgroup', 'Mine · ' + mine.length));
  mine.forEach(s => specsRail.appendChild(specRow(s)));
  specsRail.appendChild(el('div','specgroup', 'Watched repos · ' + watched.length));
  watched.forEach(s => specsRail.appendChild(specRow(s)));
}

/* One card renderer: a Needs block, a Ready line, a Waiting line, a group line
   and a fold line all render from this one function, so every part
   the card carries — chip, title, states, facts, labels, detail, the Jira line,
   links, age and parking — is here rather than per layout. The one exception is
   the rules' own 'gone' flag: struck history drops the states and facts that
   would read as live work, and keeps what it was and when it went. */
/* One linked ticket on the card's own line: its key, its type, its status and
   its summary — Jira hands all of it back with the link, so naming it costs no
   second call. The label is the only difference between a blocker and a link
   the card merely carries. */
function jiraLinkLine(kind, label, lk){
  const line = el('div','jira-line ' + kind);
  line.appendChild(el('span', kind + '-label', label));
  const a = document.createElement('a');
  a.className='jira'; a.href=lk.url || ('https://launchmetrics.atlassian.net/browse/'+lk.key);
  a.target='_blank'; a.rel='noreferrer';
  a.textContent = lk.key;
  line.appendChild(a);
  if(lk.type) line.appendChild(el('span','jira-type', lk.type));
  if(lk.status) line.appendChild(el('span','badge ' + jiraTone(lk.status_category), lk.status));
  if(lk.summary) line.appendChild(el('span','jira-summary', lk.summary));
  return line;
}

function card(it, kind){
  const chg = view.flag(it);
  const gone = !!(chg && chg.kind === 'gone');
  const c = el('div','row ' + kind + view.changeClass(chg)
                     + (view.parked(it) ? ' snoozed' : '') + (it.draft ? ' draft' : '')
                     + (view.closed(it) ? ' done' : ''));
  if(it.key) c.dataset.key = it.key;
  if(it.chip) c.appendChild(el('span','chip '+chipClass(it.chip), it.chip));
  const b = el('div','body');
  const t = el('div','title');
  const a = document.createElement('a');
  a.href = it.url; a.target = '_blank'; a.rel='noreferrer'; a.textContent = it.title;
  t.appendChild(a);
  if(!gone){
    for(const st of it.states || []) t.appendChild(el('span','badge '+(st.tier||''), st.label));
    if(it.draft) t.appendChild(el('span','badge draft','draft'));
  }
  b.appendChild(t);
  const m = el('div','meta');
  if(chg){
    m.appendChild(el('span','chg ' + view.changeTone(chg), view.changeLabel(chg)));
    m.appendChild(document.createTextNode(' · '));
  }
  if(it.author){
    const pr = it.chip === 'MY PR' || it.chip === 'REVIEW' || it.chip === 'REVIEWED';
    const img = document.createElement('img');
    img.className='avatar'; img.loading='lazy'; img.alt='';
    img.src='https://github.com/'+encodeURIComponent(it.author)+'.png?size=32';
    if(pr){
      const who = document.createElement('a');
      who.className='avatar-link'; who.target='_blank'; who.rel='noreferrer';
      who.href='https://github.com/'+encodeURIComponent(it.author);
      who.title=it.author;
      who.appendChild(img);
      m.appendChild(who);
    }else{
      img.title='by '+it.author;
      m.appendChild(img);
      const who = document.createElement('a');
      who.className='author'; who.target='_blank'; who.rel='noreferrer'; who.textContent=it.author;
      who.href='https://github.com/'+encodeURIComponent(it.author);
      m.appendChild(who);
    }
    m.appendChild(document.createTextNode(' · '));
  }
  const refParts = String(it.ref || '').split('#');
  if(it.container){
    const repo = document.createElement('a');
    repo.className='repo'; repo.target='_blank'; repo.rel='noreferrer';
    repo.href='https://github.com/'+it.container; repo.textContent=refParts[0];
    m.appendChild(repo);
    m.appendChild(document.createTextNode('#'+refParts[1]));
  }else if(it.ref){
    m.appendChild(document.createTextNode(it.ref));
  }
  if(!gone) for(const f of (it.facts || [])) m.appendChild(el('span','fact '+(f.tone||'warn'), f.label));
  if(it.detail) m.appendChild(document.createTextNode(' · ' + it.detail));
  b.appendChild(m);
  if(it.jira){
    const jr = el('div','jira-line');
    const j = document.createElement('a');
    j.className='jira'; j.href=it.jira; j.target='_blank'; j.rel='noreferrer';
    j.textContent=it.jira.split('/').pop();
    jr.appendChild(j);
    if(it.jira_issue){
      if(it.jira_issue.type) jr.appendChild(el('span','jira-type', it.jira_issue.type));
      if(!gone && it.jira_issue.status){
        jr.appendChild(el('span','badge ' + jiraTone(it.jira_issue.status_category), it.jira_issue.status));
      }
      if(it.jira_issue.summary) jr.appendChild(el('span','jira-summary', it.jira_issue.summary));
    }
    b.appendChild(jr);
  }
  /* Jira links that are not dependencies — the ticket you raised with another
     team and are waiting on — read like a blocker: key, its own type, status
     and summary, all of it carried by the link. Struck history keeps none of
     it: a ghost's links are as stale as the card. */
  if(!gone) for(const blk of it.blocked_by || []) b.appendChild(jiraLinkLine('blocked', 'blocked by ', blk));
  if(!gone) for(const lk of it.linked || []) b.appendChild(jiraLinkLine('linked', 'linked ', lk));
  if(it.labels && it.labels.length){
    const ls = el('div','labels');
    for(const l of it.labels) ls.appendChild(labelChip(l));
    b.appendChild(ls);
  }
  const foot = el('div','foot');
  foot.appendChild(el('span','age', (gone && it.goneAt) ? ageOf(it.goneAt) : (it.age || '')));
  const pill = kidPill(it);
  if(pill) foot.appendChild(pill);
  foot.appendChild(parkControl(it));
  b.appendChild(foot);
  c.appendChild(b);
  return c;
}

/* Linked items behind a count at the row's right, beside age and parking,
   expanding in place. Never a left-edge twisty. */
function kidPill(it){
  const kids = it.children || [];
  if(!kids.length) return null;
  const b = el('button','kidpill');
  const paint = open => {
    b.textContent = (open ? '\u25be ' : '\u25b8 ') + kids.length + ' linked';
    b.setAttribute('aria-expanded', String(open));
    b.title = (open ? 'hide the ' : 'show the ') + kids.length + ' linked items';
    b.classList.toggle('open', open);
  };
  paint(false);
  b.onclick = e => {
    e.preventDefault(); e.stopPropagation();
    const host = b.closest('.row');
    const existing = host.querySelector('.children');
    if(existing){ existing.remove(); paint(false); return; }
    const nest = el('div','children');
    for(const c of kids) nest.appendChild(child(c));
    host.querySelector('.body').appendChild(nest);
    paint(true);
  };
  return b;
}

/* A linked child is not a card of its own place: it keeps its own chip, ref,
   states, facts, labels, detail and age wherever its parent renders. */
function child(c){
  const k = el('div','child' + (view.closed(c) ? ' done' : ''));
  if(c.chip) k.appendChild(el('span','chip mini '+chipClass(c.chip), c.chip));
  const a = document.createElement('a');
  a.href=c.url; a.target='_blank'; a.rel='noreferrer';
  a.textContent = c.ref || c.title || '';
  a.title = c.title || c.ref || '';
  k.appendChild(a);
  for(const st of c.states || []) k.appendChild(el('span','badge '+st.tier, st.label));
  const cchg = view.flag(c);
  if(cchg) k.appendChild(el('span','chg ' + view.changeTone(cchg), view.changeLabel(cchg)));
  for(const f of (c.facts||[])) k.appendChild(el('span','fact '+(f.tone||'warn'), f.label));
  for(const l of (c.labels||[])) k.appendChild(labelChip(l));
  if(c.detail) k.appendChild(el('span','child-detail', c.detail));
  if(c.age) k.appendChild(el('span','child-age', c.age));
  return k;
}

async function park(key, value){
  const acking = value === 'ack', unacking = value === 'unack';
  const res = await fetch(acking || unacking ? '/acks' : '/snoozes', {
    method: 'POST', headers: {'content-type': 'application/json'},
    body: JSON.stringify(acking ? {key} : unacking ? {key, clear: true} : {key, hours: Number(value)})});
  const stored = await res.json();
  if(acking || unacking) acks = stored; else snoozes = stored;
  load();
}
function parkControl(r){
  const wrap = el('span','snooze');
  const snoozeUntil = view.snoozeOf(r), ackedAt = view.ackOf(r);
  if(snoozeUntil || ackedAt){
    const b = el('button','wake', ackedAt ? 'unack' : 'wake');
    b.onclick = () => park(r.key, ackedAt ? 'unack' : '0');
    wrap.appendChild(b);
    wrap.appendChild(el('span','wakeat', ackedAt ? 'until it changes' : view.formatWhen(snoozeUntil)));
    return wrap;
  }
  const sel = document.createElement('select');
  const ph = document.createElement('option');
  ph.value = ''; ph.textContent = '⏰ snooze / ack';
  sel.appendChild(ph);
  for(const c of view.choices){
    const o = document.createElement('option');
    o.value = c.value; o.textContent = c.label;
    sel.appendChild(o);
  }
  sel.onchange = () => { if(sel.value) park(r.key, sel.value); };
  wrap.appendChild(sel);
  return wrap;
}
const ageOf = iso => {
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  return s < 60 ? 'just now' : s < 3600 ? Math.floor(s/60) + 'm ago'
       : s < 86400 ? Math.floor(s/3600) + 'h ago' : Math.floor(s/86400) + 'd ago';
};
function chipClass(c){return c==='REVIEW'?'REVIEW':c==='ISSUE'?'ISSUE':c==='JIRA'?'JIRA':c==='REVIEWED'?'REVIEWED':'MY';}
/* Jira's own status category -> the badge tone the card paints it with. */
function jiraTone(cat){
  const c = String(cat||'').toLowerCase();
  return c==='done'?'ready':c==='in progress'?'wip':'waiting';
}
function helpBox(lines){
  const d = document.createElement('details');
  d.className = 'fold';
  const s = document.createElement('summary');
  s.textContent = 'How this queue works';
  d.appendChild(s);
  const ul = document.createElement('ul');
  ul.className = 'help';
  for(const line of lines) ul.appendChild(el('li', null, line));
  d.appendChild(ul);
  return d;
}
function labelChip(l){
  const hex = (l.color||'').replace('#','').padEnd(6,'0');
  const r=parseInt(hex.slice(0,2),16)||0, g=parseInt(hex.slice(2,4),16)||0, bl=parseInt(hex.slice(4,6),16)||0;
  const s = el('span','gh-label',l.name);
  s.style.background='#'+hex;
  s.style.color=(0.299*r+0.587*g+0.114*bl)>150?'#24292f':'#ffffff';
  return s;
}
function errBox(e, summary){
